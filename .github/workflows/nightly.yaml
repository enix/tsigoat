name: Nightly

# Long checks that do not fit in a pull request: every fuzz target runs for
# ten minutes, cert-manager obtains certificates through tsigoat installed
# with its chart in a k3s cluster, and gremlins reports the mutants that the
# tests miss.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  DO_NOT_TRACK: "1"

jobs:
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # The report outlives a failure: the output, and the inputs that made a
      # target fail, at the paths where go test reads them.
      - uses: ./.github/actions/dagger
        with:
          args: fuzz-report --fuzztime=10m export --path=fuzz-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzzing
          path: fuzz-report
          retention-days: 30
      - name: Check the status of the fuzzing
        run: |
          status=$(cat fuzz-report/status)
          if [ "$status" != 0 ]; then
            echo "::error::A fuzz target failed (status $status): the corpus of the fuzzing artifact holds the inputs, to commit as regression cases."
            exit 1
          fi

  acceptance:
    name: cert-manager acceptance (PowerDNS ${{ matrix.pdns }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pdns: ["4.9", "5.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-acceptance --pdns-version=${{ matrix.pdns }}

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: mutation
