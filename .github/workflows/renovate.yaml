name: Renovate

# Self-hosted Renovate, run as a GitHub App so that its pull requests trigger
# the regular workflows. It runs every morning, for the vulnerability fixes,
# which ignore schedules; the schedule of renovate.json5 keeps the ordinary
# updates, and the CI they start, to Tuesday morning, Paris time, when it
# runs three times, so that the pull requests left are rebased once others
# are merged. The Dependency Dashboard asks for a waiting update at once.
#
# Required secrets: RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY. To
# see the vulnerabilities, the App needs read access to Dependabot alerts,
# and the repository the dependency graph and Dependabot alerts.
# Optional: DOCKERHUB_READONLY_USERNAME and DOCKERHUB_READONLY_TOKEN, to
# avoid the anonymous Docker Hub rate limit.
on:
  schedule:
    # 05:23 UTC every day; then 07:23 and 09:23 UTC on Tuesday: from 06:23 to
    # 11:23 in Paris, within the window of renovate.json5.
    - cron: "23 5 * * *"
    - cron: "23 7,9 * * 2"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level for this run
        type: choice
        default: info
        options: [debug, info, warn, error]
      dryRun:
        description: Dry run mode (skip opening pull requests)
        type: choice
        default: disabled
        options: [disabled, extract, lookup, full]
  push:
    branches: [main]
    paths:
      - "renovate.json5"
      - ".github/workflows/renovate.yaml"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # The permissions of the App, all of them: a token that asks for one
          # the App lacks is refused.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-vulnerability-alerts: read
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_HOST_RULES: |
            [
              {
                "matchHost": "index.docker.io",
                "username": "${{ secrets.DOCKERHUB_READONLY_USERNAME }}",
                "password": "${{ secrets.DOCKERHUB_READONLY_TOKEN }}"
              },
              {
                "matchHost": "api.github.com",
                "token": "${{ github.token }}"
              }
            ]
          RENOVATE_DRY_RUN: ${{ (inputs.dryRun != '' && inputs.dryRun != 'disabled') && inputs.dryRun || '' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          # An exact version rather than the series of the action, since
          # Renovate runs with the write access of the App.
          renovate-version: 44.167.7
