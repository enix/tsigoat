name: Tag a release

# Run by a maintainer: on main for a release candidate, vX.Y.Z-rc.N; on
# release for a stable version, vX.Y.Z, once release moved forward to the
# commit of main that a candidate tested. semantic-release (.releaserc.mjs)
# computes the version from the Conventional Commits since the last stable
# version, pushes its tag and leaves a draft GitHub release with its notes;
# the workflow then starts the release workflow on the tag, which builds,
# attaches the artifacts to the draft, publishes it and announces it. A tag
# created with the GITHUB_TOKEN starts no workflow, but a dispatch does. A dry
# run prints the version and its notes, and tags nothing.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the next version and its notes, tag nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the next version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag and its git note, create the draft release
      actions: write # start the release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/release/.node-version
          # No cache when releasing: a poisoned cache could reach the release.
          package-manager-cache: false
      - name: Install semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      # semantic-release needs the branch of the stable versions, even for a
      # candidate; release starts at the first stable version, which a
      # maintainer tags by hand.
      - name: Check the release branch
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/release >/dev/null; then
            echo "::error::The release branch does not exist yet: it starts at the first stable version, tagged by hand, as the Releases section of CONTRIBUTING.md tells."
            exit 1
          fi
      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = true ]; then
            args=(--dry-run)
          fi
          .github/release/node_modules/.bin/semantic-release "${args[@]}"
      - name: Start the release
        if: steps.release.outputs.dry-run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Started the release of $TAG." >> "$GITHUB_STEP_SUMMARY"
      # Nothing since the last version makes a release: the maintainer
      # dispatched this workflow for one.
      - name: Check that there is a version to tag
        if: steps.release.outputs.tag == ''
        run: |
          echo "::error::No commit since the last version makes a release."
          exit 1
