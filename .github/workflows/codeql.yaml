name: CodeQL

# Static analysis with GitHub CodeQL on every pull request targeting main,
# and weekly on main, which gives the pull requests the analysis of the
# default branch that they compare against and picks up new queries against
# unchanged code. Committed as a workflow rather than GitHub's default setup
# to get SHA-pinned actions and concurrency cancellation.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload SARIF
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # A manual build analyzes the tsigoat module only: the automatic one
          # also builds the Dagger module, whose bindings are generated rather
          # than committed, and which asks for another Go version.
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: auto
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
