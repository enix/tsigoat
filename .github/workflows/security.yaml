name: Security Checks

# Runs on every pull request, daily on main to catch newly published
# vulnerabilities, and from the release workflow.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_call:

permissions:
  contents: read

env:
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  DO_NOT_TRACK: "1"

jobs:
  # Any file can leak a secret, so this job always runs.
  secrets:
    name: Secret leaks (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: gitleaks

  govulncheck:
    name: Reachable vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: govulncheck

  vuln-deps:
    name: Vulnerable dependencies (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: trivy --scan-type=fs

  chart:
    name: Chart misconfigurations (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # The chart renders only with a configuration.
      - uses: ./.github/actions/dagger
        with:
          args: trivy --scan-type=config --scan-ref=chart --helm-values=examples/helm/cert-manager.values.yaml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
