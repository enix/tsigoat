name: OpenVEX

# Generates an OpenVEX document when a release is published and attaches it
# to the release assets.
on:
  workflow_dispatch:
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  vexctl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the VEX document to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set environment variables
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Run vexctl
        uses: openvex/generate-vex@c59881b41451d7ccba5c3b74cd195382b8971fcd
        # Refer: https://github.com/openvex/vexctl#operational-model
        with:
          product: pkg:golang/github.com/enix/tsigoat@${{ env.RELEASE_VERSION }}
          file: tsigoat.openvex.json

      - name: Upload OpenVEX document to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" tsigoat.openvex.json
