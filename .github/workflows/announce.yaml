name: Announce a release

# Posts each release on Slack once a maintainer publishes it, release
# candidates included: the version, the notes, and a link to the release
# (scripts/announce-release.py). The release workflow leaves a draft, which
# the announcers of GoReleaser would post before its review: the publication
# is the moment.
#
# Required secret: SLACK_WEBHOOK, the URL of an incoming webhook of the Slack
# channel; the workflow fails without it.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: announce-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  slack:
    name: Post on Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Post the release
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python3 scripts/announce-release.py
