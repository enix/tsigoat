name: Tests

# Same shape as lint.yaml: scoped by path detection on pull requests, runs
# everything on main and when called from another workflow (the release).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip-e2e:
        description: Skip the end-to-end suite.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      helm: ${{ steps.filter.outputs.helm }}
      webhook: ${{ steps.filter.outputs.webhook }}
      packages: ${{ steps.filter.outputs.packages }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'test/**'
              - 'dagger/**'
              - 'dagger.json'
              - '.github/actions/dagger/**'
              - '.github/workflows/test.yaml'
            helm:
              - 'chart/**'
              - 'examples/helm/**'
            webhook:
              - 'examples/webhook/**'
            packages:
              - '.goreleaser.yaml'
              - 'build/package/**'
              - 'examples/config.yaml'
            release:
              - '.releaserc.mjs'
              - '.github/release/**'

  unit:
    name: Unit tests
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test

  # Renders the chart with every example and fixture, and checks the result
  # with the configuration rules of tsigoat, promtool and kubeconform.
  helm:
    name: Helm chart
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.helm == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-helm

  e2e:
    name: E2E scenarios (PowerDNS ${{ matrix.pdns }})
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pdns: ["4.9", "5.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-end-to-end --pdns-version=${{ matrix.pdns }}

  clients:
    name: Real clients (PowerDNS ${{ matrix.pdns }})
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pdns: ["4.9", "5.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-clients --pdns-version=${{ matrix.pdns }}

  acme:
    name: ACME flow (PowerDNS ${{ matrix.pdns }})
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pdns: ["4.9", "5.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-acme --pdns-version=${{ matrix.pdns }}

  webhook:
    name: Webhook example
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.webhook == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-webhook-example

  differential:
    name: Differential against BIND
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-differential

  packages:
    name: deb and rpm packages
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.packages == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-packages

  release:
    name: Release configuration
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/dagger
        with:
          args: test-release

  # The one check of this workflow that the rules of main require: it passes
  # when every other job passed or was skipped by the paths of the change, and
  # fails when one failed or was canceled, the detection of the paths
  # included, whose failure would skip the others.
  passed:
    name: Tests passed
    if: always()
    needs: [changes, unit, helm, e2e, clients, acme, webhook, differential, packages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Jobs that did not pass: $(paste -sd ' ' <<<"$failed")"
            exit 1
          fi
