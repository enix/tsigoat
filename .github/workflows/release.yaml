name: Release

# Runs on a version tag: the Tag a release workflow (tag.yaml) creates it,
# with the version that svu computes, and starts this workflow on it; a tag
# that a maintainer pushes starts it too. The quality gates run first;
# GoReleaser then builds the binaries and images, signs everything with
# cosign keyless, and leaves a draft GitHub Release with a changelog
# generated from the Conventional Commits. The maintainer reviews and
# publishes it, which announces it on Slack (announce.yaml). The Helm chart
# follows the images, with the same version.
#
# Secrets of the `release` environment for the images, which GoReleaser
# pushes to ghcr.io, with the GITHUB_TOKEN, quay.io and docker.io: QUAY_USERNAME
# and QUAY_TOKEN, DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The release stops
# before any push when one of them, or of those of the chart, is missing.
#
# Settings of the `release` environment for the chart:
#   - variable CHART_REGISTRY: OCI repository of the chart, without oci://;
#     ghcr.io/enix/charts by default, pushed with the GITHUB_TOKEN;
#   - secrets CHART_REGISTRY_USERNAME and CHART_REGISTRY_TOKEN: credentials
#     of another registry than ghcr.io;
#   - secret GH_TOKEN_PUBLISH_HELM_CHART: with a CHART_REGISTRY on quay.io, a
#     token allowed to run the helmchart-publish.yml workflow of
#     enix/helm-charts, which adds the chart to the classic repository of
#     charts.enix.io; that workflow reads charts from quay.io only.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Started on its tag by tag.yaml, since a tag that the GITHUB_TOKEN
  # creates starts no workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Releases come from main: tag.yaml tags main alone, but a maintainer
      # may push a tag on any commit.
      - name: Check that the release runs on a version tag of main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::A release runs on a version tag, not on $REF."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$REF tags $GITHUB_SHA, which main does not hold."
            exit 1
          fi

  security:
    needs: tag
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read

  lint:
    needs: security
    uses: ./.github/workflows/lint.yaml
    permissions:
      contents: read
    with:
      skip-renovate: true

  test:
    needs: security
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  goreleaser:
    name: Build, push and sign
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment: required reviewers, registry credentials.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
      id-token: write # OIDC for cosign keyless and provenance signing
      attestations: write # upload the build provenance
    steps:
      # GoReleaser pushes to every registry of .goreleaser.yaml, and the chart
      # job to CHART_REGISTRY: a credential missing there would stop the
      # release midway, once part of it is public.
      - name: Check the registry credentials
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/enix/charts' }}
          CHART_REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          CHART_REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN }}
          GH_TOKEN_PUBLISH_HELM_CHART: ${{ secrets.GH_TOKEN_PUBLISH_HELM_CHART }}
        run: |
          missing=()
          required=(QUAY_USERNAME QUAY_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN)
          if [[ "$CHART_REGISTRY" != ghcr.io/* ]]; then
            required+=(CHART_REGISTRY_USERNAME CHART_REGISTRY_TOKEN)
          fi
          if [[ "$CHART_REGISTRY" == quay.io/* ]]; then
            required+=(GH_TOKEN_PUBLISH_HELM_CHART)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The release environment lacks ${missing[*]}: nothing was published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # No build cache when publishing: a poisoned cache could reach the
          # released artifacts.
          cache: false
      # No QEMU: the Dockerfiles copy the binary built for each platform and
      # run nothing, so that buildx needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Login to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GODEBUG: http2client=0
      # SLSA build provenance over the checksums file, which covers every
      # archive. Verify with `gh attestation verify <archive> --owner enix`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt
      # One CycloneDX SBOM per pushed image, attached as a cosign attestation.
      - name: Generate and attest image SBOMs
        env:
          COSIGN_YES: "true"
          GODEBUG: http2client=0
        run: |
          set -euo pipefail
          while read -r ref; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            echo "${ref%:*}@${digest}"
          done < <(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json) \
            | sort -u \
            | while read -r ref_by_digest; do
                echo "::group::SBOM for $ref_by_digest"
                syft "$ref_by_digest" -o cyclonedx-json=/tmp/sbom.json
                cosign attest --predicate /tmp/sbom.json --type cyclonedx "$ref_by_digest"
                rm -f /tmp/sbom.json
                echo "::endgroup::"
              done

  chart:
    name: Chart publish and sign
    needs: goreleaser # the chart points to the images just pushed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC for cosign keyless
    env:
      CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/enix/charts' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # helm and cosign keep their own credentials.
      - name: Login to the chart registry
        env:
          REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host="${CHART_REGISTRY%%/*}"
          echo "$REGISTRY_TOKEN" | helm registry login --username "$REGISTRY_USERNAME" --password-stdin "$host"
          echo "$REGISTRY_TOKEN" | cosign login --username "$REGISTRY_USERNAME" --password-stdin "$host"
      # The version of the tag, for the chart and for the images; Artifact
      # Hub marks the release candidates as prereleases.
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          sed -i "s|^  artifacthub.io/prerelease:.*|  artifacthub.io/prerelease: \"${prerelease}\"|" chart/Chart.yaml
          cp LICENSE chart/LICENSE
          helm package chart --destination dist --version "$version" --app-version "$version"
      - name: Push
        id: push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out=$(helm push "dist/tsigoat-${version}.tgz" "oci://${CHART_REGISTRY}" 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -1)
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "ref=${CHART_REGISTRY}/tsigoat@${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          COSIGN_YES: "true"
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: cosign sign "$CHART_REF"
      # The classic repository of charts.enix.io, for `helm repo add`: an
      # index pointing to the OCI chart, which enix/helm-charts publishes.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: startsWith(env.CHART_REGISTRY, 'quay.io/')
      - name: Publish to charts.enix.io
        if: startsWith(env.CHART_REGISTRY, 'quay.io/')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PUBLISH_HELM_CHART }}
          REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | oras login --username "$REGISTRY_USERNAME" --password-stdin quay.io
          helm repo index dist
          yq -i ".entries.tsigoat[0].urls = [\"oci://${CHART_REGISTRY}/tsigoat:${version}\"]" dist/index.yaml
          mv dist/index.yaml dist/index-latest.yaml
          (cd dist && oras push "${CHART_REGISTRY}/tsigoat:index-latest.yaml" \
            --artifact-type application/yaml index-latest.yaml:application/yaml)
          gh workflow run helmchart-publish.yml --repo enix/helm-charts \
            -f "index_path=${CHART_REGISTRY#quay.io/}/tsigoat:index-latest.yaml"
