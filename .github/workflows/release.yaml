name: Release

# Runs on a version tag: semantic-release pushes it from the Tag a release
# workflow (tag.yaml), with a draft GitHub release that holds its notes, and
# that workflow starts this one on it; a tag that a maintainer pushes, after
# creating its draft, starts it too. The quality gates run first; GoReleaser
# then builds the binaries, packages and images, signs them with cosign
# keyless, and attaches them to the draft; the Helm chart follows the
# images, with the same version. Once everything is there, the last job
# publishes the draft and announces it on Slack, with semantic-release-slack-bot
# (.github/release/announce.mjs) and the incoming webhook of the SLACK_WEBHOOK
# secret of the repository.
#
# Secrets of the `release` environment for the images, which GoReleaser
# pushes to ghcr.io, with the GITHUB_TOKEN, quay.io and docker.io: QUAY_USERNAME
# and QUAY_TOKEN, DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The release stops
# before any push when one of them, or of those of the chart, is missing.
#
# Settings of the `release` environment for the chart:
#   - variable CHART_REGISTRY: OCI repository of the chart, without oci://;
#     ghcr.io/enix/charts by default, pushed with the GITHUB_TOKEN;
#   - secrets CHART_REGISTRY_USERNAME and CHART_REGISTRY_TOKEN: credentials
#     of another registry than ghcr.io;
#   - secret GH_TOKEN_PUBLISH_HELM_CHART: with a CHART_REGISTRY on quay.io, a
#     token allowed to run the helmchart-publish.yml workflow of
#     enix/helm-charts, which adds the chart to the classic repository of
#     charts.enix.io; that workflow reads charts from quay.io only.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Started on its tag by tag.yaml, since a tag that the GITHUB_TOKEN
  # pushes starts no workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # read the draft releases, which need write access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release candidates come from main, stable versions from release;
      # tag.yaml tags those alone, but a maintainer may push a tag on any
      # commit.
      - name: Check that the release runs on a version tag of its branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::A release runs on a version tag, not on $REF."
            exit 1
          fi
          branch=release
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            branch=main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::$REF tags $GITHUB_SHA, which $branch does not hold."
            exit 1
          fi
      # GoReleaser attaches the artifacts to the draft of the tag, which
      # holds the notes: it would otherwise create a release without them.
      - name: Check the draft release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! release=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,name,body); then
            echo "::error::$GITHUB_REF_NAME has no release: Tag a release leaves a draft, which a tag pushed by hand needs too."
            exit 1
          fi
          if ! jq -e --arg tag "$GITHUB_REF_NAME" '.isDraft and .name == $tag and (.body | length > 0)' <<<"$release" >/dev/null; then
            echo "::error::The release of $GITHUB_REF_NAME must be a draft named $GITHUB_REF_NAME, with notes: $(jq -c '{isDraft, name}' <<<"$release")."
            exit 1
          fi

  security:
    name: Security
    needs: tag
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read

  lint:
    name: Lint
    needs: security
    uses: ./.github/workflows/lint.yaml
    permissions:
      contents: read
    with:
      skip-renovate: true

  test:
    name: Test
    needs: security
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  goreleaser:
    name: Build, push and sign
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment: required reviewers, registry credentials.
    environment: release
    permissions:
      contents: write # attach the artifacts to the draft release
      packages: write # push to ghcr.io
      id-token: write # OIDC for cosign keyless and provenance signing
      attestations: write # upload the build provenance
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      # GoReleaser pushes to every registry of .goreleaser.yaml, the chart
      # job to CHART_REGISTRY, and the last job announces on Slack: a secret
      # missing there would stop the release midway, once part of it is
      # public.
      - name: Check the credentials
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/enix/charts' }}
          CHART_REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          CHART_REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN }}
          GH_TOKEN_PUBLISH_HELM_CHART: ${{ secrets.GH_TOKEN_PUBLISH_HELM_CHART }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          missing=()
          required=(QUAY_USERNAME QUAY_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN SLACK_WEBHOOK)
          if [[ "$CHART_REGISTRY" != ghcr.io/* ]]; then
            required+=(CHART_REGISTRY_USERNAME CHART_REGISTRY_TOKEN)
          fi
          if [[ "$CHART_REGISTRY" == quay.io/* ]]; then
            required+=(GH_TOKEN_PUBLISH_HELM_CHART)
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The release environment lacks ${missing[*]}: nothing was published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # No build cache when publishing: a poisoned cache could reach the
          # released artifacts.
          cache: false
      # No QEMU: the Dockerfiles copy the binary built for each platform and
      # run nothing, so that buildx needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Login to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GODEBUG: http2client=0
          # The tag of the run, which GoReleaser would otherwise choose among
          # the tags of the commit: a release may share it with a candidate.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # The chart pulls the tags of the release by digest. GoReleaser builds
      # each image once, for every platform, and pushes that index under every
      # name: each tag has one digest, which every registry must serve.
      - name: Collect the digests of the images
        id: digests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          images=$(jq -c --arg version "$version" '
            [.[] | select(.type == "Docker Image")
                 | {name, tag: (.name | sub("^.*:"; "")), digest: .extra.Digest}
                 | select(.tag == $version or .tag == $version + "-busybox")]' dist/artifacts.json)
          while read -r name digest; do
            served=$(docker buildx imagetools inspect "$name" --format '{{ .Manifest.Digest }}')
            if [ "$served" != "$digest" ]; then
              echo "::error::$name serves $served, not $digest, which GoReleaser pushed."
              exit 1
            fi
          done < <(jq -r '.[] | "\(.name) \(.digest)"' <<<"$images")
          grouped=$(jq -c 'group_by(.tag) | map({key: .[0].tag, value: (map(.digest) | unique)}) | from_entries' <<<"$images")
          if ! jq -e --arg version "$version" 'keys == ([$version, $version + "-busybox"] | sort) and all(.[]; length == 1)' <<<"$grouped" >/dev/null; then
            echo "::error::Each tag of the release needs one digest: $grouped"
            exit 1
          fi
          digests=$(jq -c 'map_values(.[0])' <<<"$grouped")
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
          # Each image of each registry, by digest, once: its tags share it.
          jq -r '.[] | select(.type == "Docker Image") | "\(.name | sub(":[^:/]*$"; ""))@\(.extra.Digest)"' dist/artifacts.json \
            | sort -u > dist/images.txt
      # One signature per image and registry, rather than one per tag: a
      # second signature of a digest is refused to the GITHUB_TOKEN by ghcr.io.
      - name: Sign the images
        env:
          COSIGN_YES: "true"
          GODEBUG: http2client=0
        run: |
          set -euo pipefail
          while read -r image; do
            echo "::group::Signing $image"
            cosign sign "$image"
            echo "::endgroup::"
          done < dist/images.txt
      # SLSA build provenance over the checksums file, which covers every
      # archive; SECURITY.md tells how to verify it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt
      # One CycloneDX SBOM per image and registry, by the digest that
      # GoReleaser pushed, attached as a cosign attestation.
      - name: Generate and attest image SBOMs
        env:
          COSIGN_YES: "true"
          GODEBUG: http2client=0
        run: |
          set -euo pipefail
          while read -r image; do
            echo "::group::SBOM for $image"
            syft "$image" -o cyclonedx-json=/tmp/sbom.json
            cosign attest --predicate /tmp/sbom.json --type cyclonedx "$image"
            rm -f /tmp/sbom.json
            echo "::endgroup::"
          done < dist/images.txt

  chart:
    name: Chart publish and sign
    needs: goreleaser # the chart points to the images just pushed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC for cosign keyless
    env:
      CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/enix/charts' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # helm and cosign keep their own credentials.
      - name: Login to the chart registry
        env:
          REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          host="${CHART_REGISTRY%%/*}"
          echo "$REGISTRY_TOKEN" | helm registry login --username "$REGISTRY_USERNAME" --password-stdin "$host"
          echo "$REGISTRY_TOKEN" | cosign login --username "$REGISTRY_USERNAME" --password-stdin "$host"
      # The version of the tag, for the chart and for the images, whose tags
      # the chart pulls by digest; Artifact Hub marks the release candidates
      # as prereleases.
      - name: Package
        env:
          DIGESTS: ${{ needs.goreleaser.outputs.digests }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          sed -i "s|^  artifacthub.io/prerelease:.*|  artifacthub.io/prerelease: \"${prerelease}\"|" chart/Chart.yaml
          if [ "$(grep -c '^  digests: {}$' chart/values.yaml)" -ne 1 ]; then
            echo "::error::chart/values.yaml lacks the line of image.digests to fill."
            exit 1
          fi
          sed -i "s|^  digests: {}\$|  digests: ${DIGESTS}|" chart/values.yaml
          cp LICENSE chart/LICENSE
          helm package chart --destination dist --version "$version" --app-version "$version"
          for suffix in "" -busybox; do
            tag="$version$suffix"
            want="ghcr.io/enix/tsigoat:$tag@$(jq -r --arg tag "$tag" '.[$tag]' <<<"$DIGESTS")"
            got=$(helm template tsigoat "dist/tsigoat-$version.tgz" --values test/chart/valid/minimal.yaml \
              --set "image.tagSuffix=$suffix" | yq 'select(.kind == "Deployment") | .spec.template.spec.containers[0].image')
            if [ "$got" != "$want" ]; then
              echo "::error::The chart pulls $got, not $want."
              exit 1
            fi
          done
      - name: Push
        id: push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out=$(helm push "dist/tsigoat-${version}.tgz" "oci://${CHART_REGISTRY}" 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$out" | grep -oE 'sha256:[a-f0-9]{64}' | head -1)
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "ref=${CHART_REGISTRY}/tsigoat@${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          COSIGN_YES: "true"
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: cosign sign "$CHART_REF"
      # The classic repository of charts.enix.io, for `helm repo add`: an
      # index pointing to the OCI chart, which enix/helm-charts publishes.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: startsWith(env.CHART_REGISTRY, 'quay.io/')
      - name: Publish to charts.enix.io
        if: startsWith(env.CHART_REGISTRY, 'quay.io/')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PUBLISH_HELM_CHART }}
          REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.CHART_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | oras login --username "$REGISTRY_USERNAME" --password-stdin quay.io
          helm repo index dist
          yq -i ".entries.tsigoat[0].urls = [\"oci://${CHART_REGISTRY}/tsigoat:${version}\"]" dist/index.yaml
          mv dist/index.yaml dist/index-latest.yaml
          (cd dist && oras push "${CHART_REGISTRY}/tsigoat:index-latest.yaml" \
            --artifact-type application/yaml index-latest.yaml:application/yaml)
          gh workflow run helmchart-publish.yml --repo enix/helm-charts \
            -f "index_path=${CHART_REGISTRY#quay.io/}/tsigoat:index-latest.yaml"

  publish:
    name: Publish and announce
    needs: [goreleaser, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the draft release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/release/.node-version
          # No cache when releasing: a poisoned cache could reach the release.
          package-manager-cache: false
      - name: Install semantic-release-slack-bot
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      # The draft stays one until it holds every file that the checksums
      # cover, the checksums and their signature. GitHub renames the files
      # that it attaches: the ~ of the version of a candidate package
      # becomes a dot.
      - name: Check the assets of the draft
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$dir"
          want=$({ awk '{ print $2 }' "$dir/checksums.txt"; echo checksums.txt; echo checksums.txt.sigstore.json; } \
            | sed 's/[^A-Za-z0-9._+-]/./g' | sort -u)
          have=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort -u)
          missing=$(comm -23 <(echo "$want") <(echo "$have"))
          if [ -n "$missing" ]; then
            echo "::error::The draft lacks $(echo "$missing" | paste -sd ' ')."
            exit 1
          fi
      - name: Publish the draft
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Announce on Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,body,isPrerelease > "$RUNNER_TEMP/release.json"
          node .github/release/announce.mjs "$RUNNER_TEMP/release.json"
