name: Release

# Triggered by a vX.Y.Z tag pushed by a maintainer. The quality gates run
# first; GoReleaser then builds the binaries and images, signs everything
# with cosign keyless, and leaves a draft GitHub Release with a changelog
# generated from the Conventional Commits. The maintainer reviews and
# publishes it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yaml
    permissions:
      contents: read

  lint:
    needs: security
    uses: ./.github/workflows/lint.yaml
    permissions:
      contents: read
    with:
      skip-renovate: true

  test:
    needs: security
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  goreleaser:
    name: Build, push and sign
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment: required reviewers, registry credentials.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
      id-token: write # OIDC for cosign keyless and provenance signing
      attestations: write # upload the build provenance
    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'tsigoat' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # No build cache when publishing: a poisoned cache could reach the
          # released artifacts.
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to quay.io
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        if: env.QUAY_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Login to docker.io
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GODEBUG: http2client=0
      # SLSA build provenance over the checksums file, which covers every
      # archive. Verify with `gh attestation verify <archive> --owner enix`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt
      # One CycloneDX SBOM per pushed image, attached as a cosign attestation.
      - name: Generate and attest image SBOMs
        env:
          COSIGN_YES: "true"
          GODEBUG: http2client=0
        run: |
          set -euo pipefail
          while read -r ref; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            echo "${ref%:*}@${digest}"
          done < <(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json) \
            | sort -u \
            | while read -r ref_by_digest; do
                echo "::group::SBOM for $ref_by_digest"
                syft "$ref_by_digest" -o cyclonedx-json=/tmp/sbom.json
                cosign attest --predicate /tmp/sbom.json --type cyclonedx "$ref_by_digest"
                rm -f /tmp/sbom.json
                echo "::endgroup::"
              done
