name: Pull request title

# The squash-merge commit takes the pull request title, and GoReleaser builds
# the changelog from those commits: titles must follow Conventional Commits.
#
# Runs on `pull_request`, not `pull_request_target`: reading the title needs
# no write access, and the job outcome is the check itself.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate the title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            deps
            docs
            refactor
            test
            build
            ci
            chore
            revert
