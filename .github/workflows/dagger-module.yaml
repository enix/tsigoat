name: Dagger module

# Keeps dagger/go.mod in sync with the generated bindings. When Renovate
# bumps the Dagger engine and SDK, `dagger develop` regenerates the bindings
# and may move transitive dependencies; this workflow commits the result
# back onto the pull request. Fork pull requests get a failure asking to run
# `task dagger:develop` instead.
on:
  pull_request:
    paths:
      - "dagger.json"
      - "dagger/**"
  push:
    branches: [main]
    paths:
      - "dagger.json"
      - "dagger/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  DO_NOT_TRACK: "1"

jobs:
  sync:
    name: Sync generated dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1
          # The job pushes the regenerated files back to the branch.
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/dagger
        with:
          verb: develop
      - run: go -C dagger mod tidy
      - name: Commit regenerated module dependencies if changed
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if git diff --quiet -- dagger/go.mod dagger/go.sum; then
            echo "dagger/go.mod already in sync."
            exit 0
          fi
          git --no-pager diff --stat -- dagger/go.mod dagger/go.sum
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::dagger/go.mod is out of sync with the module bindings." \
                 "Run 'task dagger:develop' and commit the result." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dagger/go.mod dagger/go.sum
          git commit -m "build(dagger): regenerate module dependencies"
          git push
