# GoReleaser drives every build of tsigoat: binaries, archives, deb and rpm
# packages, checksums and their cosign keyless signature, multi-arch container
# images (scratch by default, busybox as an alternative with a shell), and the
# GitHub Release with its changelog; the release workflow signs the images.
#
# Releases start from a version tag, which the Tag a release workflow creates
# with svu, or a maintainer pushes; the release workflow runs GoReleaser and
# leaves a draft release to review, whose publication is announced on Slack.
#
# IMAGE_NAME renames the images of local snapshots (default: tsigoat). The
# release workflow leaves it, since the chart pulls enix/tsigoat.
#
# Reference: https://goreleaser.com/customization/

version: 2

project_name: tsigoat

before:
  hooks:
    - go mod verify

# ─── Binaries ────────────────────────────────────────────────────────────────
# GORELEASER_LOCAL_PLATFORM=1 swaps the full matrix for a Linux-only build,
# used by `task build:image:host` for fast iterations.
builds:
  - id: tsigoat
    skip: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}true{{ end }}'
    main: &build-main ./cmd/tsigoat
    binary: &build-binary tsigoat
    env: &build-env
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
      - windows
    goarch:
      - amd64
      - arm64
      - riscv64
    ignore:
      - { goos: darwin, goarch: riscv64 }
      - { goos: windows, goarch: riscv64 }
    flags: &build-flags
      - -tags=netgo,osusergo
      - -trimpath
    ldflags: &build-ldflags
      - -s -w
      - -X github.com/enix/tsigoat/internal/product.version={{ .Version }}
      - -X github.com/enix/tsigoat/internal/product.buildTime={{ .Date }}
      - -X github.com/enix/tsigoat/internal/product.gitCommit={{ .FullCommit }}
      - -X github.com/enix/tsigoat/internal/product.gitTreeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}

  - id: tsigoat-local
    skip: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}{{ else }}true{{ end }}'
    main: *build-main
    binary: *build-binary
    env: *build-env
    goos: [linux]
    goarch: [amd64, arm64, riscv64]
    flags: *build-flags
    ldflags: *build-ldflags

# ─── Archives and checksums ──────────────────────────────────────────────────
archives:
  - id: default
    ids: [tsigoat, tsigoat-local]
    name_template: "tsigoat-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

# ─── Linux packages ──────────────────────────────────────────────────────────
# deb and rpm packages: the static binary, a hardened systemd unit run by the
# system user tsigoat, and /etc/tsigoat for the configuration, which the
# service waits for. docs/operations.md tells how to install them.
nfpms:
  - id: packages
    ids: [tsigoat, tsigoat-local]
    package_name: tsigoat
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Enix
    homepage: https://github.com/enix/tsigoat
    maintainer: Enix <enix@enix.fr>
    description: |-
      RFC 2136 dynamic update proxy authenticated with TSIG.
      tsigoat receives DNS updates signed with TSIG, checks them against the
      policy of their key, and applies them through the API of a DNS provider,
      or relays them to a name server: an ACME client holds a key restricted
      to its challenges, never the API key of the provider.
    license: MIT
    section: net
    priority: optional
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: build/package/tsigoat.service
        dst: /usr/lib/systemd/system/tsigoat.service
      - src: build/package/tsigoat.sysusers
        dst: /usr/lib/sysusers.d/tsigoat.conf
      - dst: /etc/tsigoat
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: tsigoat
      - src: examples/config.yaml
        dst: /usr/share/doc/tsigoat/examples/config.yaml
      - src: LICENSE
        dst: /usr/share/doc/tsigoat/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/tsigoat/LICENSE
        packager: rpm
    scripts:
      preinstall: build/package/preinstall.sh
      postinstall: build/package/postinstall.sh
      preremove: build/package/preremove.sh
      postremove: build/package/postremove.sh
    rpm:
      summary: RFC 2136 dynamic update proxy authenticated with TSIG

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Signing the checksums file rather than every archive is the usual
# SLSA-friendly pattern. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt
signs:
  - id: checksum-cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# ─── Container images ────────────────────────────────────────────────────────
dockers_v2:
  - id: scratch
    disable: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}true{{ end }}'
    ids: [tsigoat]
    dockerfile: build/Dockerfile.scratch
    platforms: &release-platforms
      - linux/amd64
      - linux/arm64
      - linux/riscv64
    images: &images
      - 'ghcr.io/enix/{{ envOrDefault "IMAGE_NAME" "tsigoat" }}'
      - 'quay.io/enix/{{ envOrDefault "IMAGE_NAME" "tsigoat" }}'
      - 'docker.io/enix/{{ envOrDefault "IMAGE_NAME" "tsigoat" }}'
    tags: &scratch-tags
      - "{{ .Version }}"
      - '{{ if and (not .IsSnapshot) (eq .Prerelease "") }}latest{{ end }}'
    sbom: false
    labels: &scratch-labels
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "RFC 2136 dynamic update proxy authenticated with TSIG"
      org.opencontainers.image.url: "https://github.com/enix/tsigoat"
      org.opencontainers.image.source: "https://github.com/enix/tsigoat"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "MIT"

  - id: scratch-local
    disable: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}{{ else }}true{{ end }}'
    ids: [tsigoat-local]
    dockerfile: build/Dockerfile.scratch
    platforms: &local-platforms
      - "linux/{{ .Runtime.Goarch }}"
    images: *images
    tags: *scratch-tags
    sbom: false
    labels: *scratch-labels

  - id: busybox
    disable: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}true{{ end }}'
    ids: [tsigoat]
    dockerfile: build/Dockerfile.busybox
    platforms: *release-platforms
    images: *images
    tags: &busybox-tags
      - "{{ .Version }}-busybox"
      - '{{ if and (not .IsSnapshot) (eq .Prerelease "") }}busybox{{ end }}'
    sbom: false
    labels: &busybox-labels
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "RFC 2136 dynamic update proxy authenticated with TSIG (busybox variant)"
      org.opencontainers.image.url: "https://github.com/enix/tsigoat"
      org.opencontainers.image.source: "https://github.com/enix/tsigoat"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.base.name: "{{ .BaseImage }}"
      org.opencontainers.image.base.digest: "{{ .BaseImageDigest }}"

  - id: busybox-local
    disable: '{{ if eq (envOrDefault "GORELEASER_LOCAL_PLATFORM" "") "1" }}{{ else }}true{{ end }}'
    ids: [tsigoat-local]
    dockerfile: build/Dockerfile.busybox
    platforms: *local-platforms
    images: *images
    tags: *busybox-tags
    sbom: false
    labels: *busybox-labels

# The release workflow signs the images, once per digest and registry: one
# signature per tag, here, signed each digest again.

# ─── Release and changelog ───────────────────────────────────────────────────
# Among the tags of a commit, which a release may share with one of its
# candidates, GoReleaser takes the highest: v0.1.0 ranks above v0.1.0-rc.1,
# which git would rank above it. The release workflow names its tag.
git:
  prerelease_suffix: "-"

release:
  github:
    owner: enix
    name: tsigoat
  prerelease: auto
  draft: true
  # A release that runs again on its tag, after a failure, starts from a new
  # draft rather than from the assets of the previous run.
  replace_existing_draft: true

# Sections mirror the Conventional Commit types; maintenance types stay out
# of the public changelog.
changelog:
  use: github
  sort: desc
  filters:
    exclude:
      - "^ci[(:!]"
      - "^chores?[(:!]"
      - "^refactor[(:!]"
      - "^tests?[(:!]"
      - "^build[(:!]"
      - "^Merge "
  groups:
    - title: "Security Updates"
      regexp: "^security[(:!]"
      order: 0
    - title: "Features"
      regexp: "^feat[(:!]"
      order: 1
    - title: "Bug Fixes"
      regexp: "^fix[(:!]"
      order: 2
    - title: "Performance"
      regexp: "^perf[(:!]"
      order: 3
    - title: "Dependencies"
      regexp: "^deps[(:!]"
      order: 4
    - title: "Documentation"
      regexp: "^docs[(:!]"
      order: 5
    - title: "Other Changes"
      order: 999
