# Every setting, with the cert-manager use case.
listen:
  - "[::]:5353"
  - "127.0.0.1:10053"
admin:
  listen: "[::]:9153"
keys:
  - name: Cert-Manager          # canonicalised to cert-manager.
    algorithm: HMAC-SHA512
    secretEnv: TSIGOAT_TEST_SECRET
  - name: admin.
    secretFile: ../../test/config/secret.txt
  - name: legacy-dhcp.
    algorithm: hmac-md5
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: pdns
    type: powerdns
    powerdns:
      url: https://pdns.example.test:8081/
      serverId: localhost
      apiKeyEnv: TSIGOAT_TEST_API_KEY
      timeout: 2s
  - name: other
    type: powerdns
    powerdns:
      url: http://other:8081
      apiKeyEnv: TSIGOAT_TEST_API_KEY
  - name: bind
    type: rfc2136
    rfc2136:
      server: ns1.example.test:53
      key:
        name: TSIGoat
        algorithm: hmac-sha1
        secretEnv: TSIGOAT_TEST_SECRET
      timeout: 3s
zones:
  - name: Example.Test
    backend: pdns
    keys: [admin]
    policy:
      - key: cert-manager.
        acme: [example.test., "*.Example.Test", "**.example.test."]
      - key: legacy-dhcp.
        names: ["*.dhcp.example.test."]
        types: [A, AAAA, PTR, ANY]
        maxTTL: 3600
        maxRecords: 4
      - key: legacy-dhcp.
        names: ["_acme-challenge.dhcp.example.test."]
        types: [txt]
        content: acme
  - name: open.test.
    backend: other
    allowUnauthenticated: true
  - name: relayed.test.
    backend: bind
    keys: [admin.]
