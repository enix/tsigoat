# Every setting, with the cert-manager use case.
listen:
  - "[::]:5353"
  - "127.0.0.1:10053"
keys:
  - name: Cert-Manager          # canonicalised to cert-manager.
    algorithm: HMAC-SHA512
    secretEnv: TSIGOAT_TEST_SECRET
  - name: admin.
    secretFile: ../../test/config/secret.txt
  - name: legacy-dhcp.
    algorithm: hmac-md5
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: pdns
    type: powerdns
    powerdns:
      url: https://pdns.example.test:8081/
      serverId: localhost
      apiKeyEnv: TSIGOAT_TEST_API_KEY
      timeout: 2s
  - name: other
    type: powerdns
    powerdns:
      url: http://other:8081
      apiKeyEnv: TSIGOAT_TEST_API_KEY
zones:
  - name: Example.Test
    backend: pdns
    keys: [admin]
    policy:
      - key: cert-manager.
        names: [_acme-challenge.example.test., "_acme-challenge.**.example.test."]
        types: [txt]
      - key: legacy-dhcp.
        names: ["*.dhcp.example.test."]
        types: [A, AAAA, PTR, ANY]
  - name: open.test.
    backend: other
    allowUnauthenticated: true
