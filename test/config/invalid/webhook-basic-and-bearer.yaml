keys:
  - name: e2e.
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: hook
    type: webhook
    webhook:
      url: https://hooks.example.test/tsigoat
      basicAuth:
        username: tsigoat
        passwordEnv: TSIGOAT_TEST_API_KEY
      bearer:
        tokenEnv: TSIGOAT_TEST_API_KEY
zones:
  - name: example.test.
    keys: [e2e.]
