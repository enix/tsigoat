keys:
  - name: e2e.
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: pdns
    type: powerdns
    powerdns:
      url: http://pdns:8081
      apiKeyEnv: TSIGOAT_TEST_API_KEY
zones:
  - name: example.test.
    policy:
      - key: e2e.
        names: [_acme-challenge.example.org.]
        types: [TXT]
