keys:
  - name: e2e.
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: provider
    type: ovh
    ovh:
      endpoint: https://api.example.test/1.0
      oauth2:
        clientId: id
        clientSecretEnv: TSIGOAT_TEST_API_KEY
zones:
  - name: example.test.
    backend: provider
    keys: [e2e.]
