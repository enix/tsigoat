# The administration server cannot take the TCP address of a DNS listener.
listen: ["127.0.0.1:5353"]
admin:
  listen: "127.0.0.1:5353"
keys:
  - name: e2e.
    secretEnv: TSIGOAT_TEST_SECRET
backends:
  - name: pdns
    type: powerdns
    powerdns:
      url: http://pdns:8081
      apiKeyEnv: TSIGOAT_TEST_API_KEY
zones:
  - name: example.test.
    keys: [e2e.]
