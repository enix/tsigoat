description: >-
  A key with an acme rule answers the DNS-01 challenges of the certificates
  that the rule names, with the values of the challenges.
refs: ["RFC 8555 8.4", "RFC 2136 3.3"]
zone:
  policy:
    - key: e2e-sha512
      acme: ["@", "**"]
requests:
  - key: e2e-sha512
    updates:
      - add _acme-challenge 60 IN TXT "pwv1DlMc4agXVh8vXVtmRdToBr7PWMzF6M9rgEWgkKg"
      - add _acme-challenge.www 60 IN TXT "SeK7fqtUzwm0Cf-v0_qKipVaYOuXL6rK777T29MgcTI"
expect:
  records:
    - _acme-challenge 60 IN TXT "pwv1DlMc4agXVh8vXVtmRdToBr7PWMzF6M9rgEWgkKg"
    - _acme-challenge.www 60 IN TXT "SeK7fqtUzwm0Cf-v0_qKipVaYOuXL6rK777T29MgcTI"
