description: >-
  A prerequisite on a name that the key may not update is refused, so that a
  narrow key cannot probe the rest of the zone.
refs: ["RFC 2136 3.3"]
zone:
  records:
    - www 300 IN A 192.0.2.1
  policy:
    - key: e2e-sha512
      names: ["_acme-challenge.**"]
      types: [TXT]
requests:
  - key: e2e-sha512
    prerequisites:
      - yxdomain www
    updates:
      - add _acme-challenge.www 60 IN TXT "token"
expect:
  rcode: REFUSED
