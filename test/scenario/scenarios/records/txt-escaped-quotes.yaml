description: A TXT record with escaped quotes survives being read back when another record joins its RRset.
refs: [A2]
requests:
  - updates:
      - 'add quote 60 IN TXT "say \"hi\""'
  - updates:
      - add quote 60 IN TXT "second"
expect:
  records:
    - 'quote 60 IN TXT "say \"hi\""'
    - quote 60 IN TXT "second"
