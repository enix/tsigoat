description: >-
  A TXT string holding UTF-8 bytes and spaces reaches the backend intact, and
  can be deleted by value whatever its escapes.
refs: ["RFC 1035 5.1", "RFC 2136 3.4.2.4"]
requests:
  - updates:
      - add txt 60 IN TXT "été  à la plage"
      - add txt 60 IN TXT "kept"
  - updates:
      - delete txt TXT "\195\169t\195\169\032\032\195\160 la plage"
expect:
  records:
    - txt 60 IN TXT "kept"
