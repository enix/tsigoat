description: The "name is in use" prerequisite fails on an absent name, so nothing changes.
refs: ["RFC 2136 2.4.4", "RFC 2136 3.2.1", P2]
knownDefect: P2
zone:
  records:
    - www 300 IN A 192.0.2.1
requests:
  - prerequisites:
      - yxdomain absent
    updates:
      - add absent 300 IN TXT "now in use"
expect:
  rcode: NXDOMAIN
