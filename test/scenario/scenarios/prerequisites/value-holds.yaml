description: The value-dependent "RRset exists" prerequisite holds with the exact RRset, so the update applies.
refs: ["RFC 2136 2.4.2", "RFC 2136 3.2.3"]
zone:
  records:
    - www 300 IN A 192.0.2.1
requests:
  - prerequisites:
      - yxrrset www A 192.0.2.1
    updates:
      - add www 300 IN TXT "checked"
expect:
  records:
    - www 300 IN A 192.0.2.1
    - www 300 IN TXT "checked"
