# A TSIG secret would land in the ConfigMap.
config:
  keys:
    - name: acme.
      secret: c2hhMjU2LXNlY3JldC1mb3ItdGhlLWNoYXJ0LXRlc3Q= # gitleaks:allow (fixture)
  backends:
    - name: pdns
      type: powerdns
      powerdns:
        url: http://pdns.example.test:8081
        apiKeyFile: /run/secrets/tsigoat/pdns
  zones:
    - name: example.test.
      keys: [acme.]
