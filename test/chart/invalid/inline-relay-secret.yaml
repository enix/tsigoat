# The TSIG secret of tsigoat for the name server would land in the ConfigMap.
config:
  keys:
    - name: acme.
      secretFile: /run/secrets/tsigoat/acme
  backends:
    - name: bind
      type: rfc2136
      rfc2136:
        server: ns1.example.test:53
        key:
          name: tsigoat.
          secret: dGhpcnR5LXR3byBieXRlcyBvZiByZWxheSBzZWNyZXQ= # gitleaks:allow (fixture)
  zones:
    - name: example.test.
      keys: [acme.]
