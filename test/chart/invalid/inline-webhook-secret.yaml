# The password of the webhook would land in the ConfigMap.
config:
  keys:
    - name: acme.
      secretFile: /run/secrets/tsigoat/acme
  backends:
    - name: hook
      type: webhook
      webhook:
        url: https://hooks.example.test/tsigoat
        basicAuth:
          username: tsigoat
          password: inline-password # gitleaks:allow (fixture)
  zones:
    - name: example.test.
      keys: [acme.]
