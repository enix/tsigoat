# imagePullSecrets lists the names of Secrets.
config:
  keys:
    - name: acme.
      secretFile: /run/secrets/tsigoat/acme
  backends:
    - name: pdns
      type: powerdns
      powerdns:
        url: http://pdns.example.test:8081
        apiKeyFile: /run/secrets/tsigoat/pdns
  zones:
    - name: example.test.
      keys: [acme.]
imagePullSecrets:
  - name: registry-credentials
