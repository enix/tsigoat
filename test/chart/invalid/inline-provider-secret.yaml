# The secret of an OAuth2 service account of OVHcloud would land in the
# ConfigMap.
config:
  keys:
    - name: acme.
      secretFile: /run/secrets/tsigoat/acme
  backends:
    - name: ovh
      type: ovh
      ovh:
        endpoint: ovh-eu
        oauth2:
          clientId: EU.0123456789abcdef
          clientSecret: inline-secret # gitleaks:allow (fixture)
  zones:
    - name: example.test.
      keys: [acme.]
