# Secrets read from environment variables, without a Secret volume.
config:
  keys:
    - name: dhcp.
      algorithm: hmac-sha512
      secretEnv: TSIGOAT_DHCP_SECRET
  backends:
    - name: pdns
      type: powerdns
      powerdns:
        url: http://pdns.example.test:8081
        apiKeyEnv: TSIGOAT_PDNS_API_KEY
        timeout: 10s
  zones:
    - name: dhcp.example.test.
      policy:
        - key: dhcp.
          names: ["*.dhcp.example.test."]
          types: [A, AAAA, TXT]
extraEnv:
  - name: TSIGOAT_DHCP_SECRET
    valueFrom:
      secretKeyRef: {name: dhcp-tsig, key: secret}
  - name: TSIGOAT_PDNS_API_KEY
    valueFrom:
      secretKeyRef: {name: pdns-api, key: key}
