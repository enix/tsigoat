# tsigoat in front of Cloudflare, for cert-manager: cert-manager signs its
# updates with a TSIG key restricted to the ACME challenges, and never sees
# the API token. docs/cloudflare.md tells how to create the token.
#
# The Secret holds the TSIG secret of the cert-manager. key and the API token;
# create it before installing the chart:
#
#   kubectl -n tsigoat create secret generic tsigoat-secrets \
#     --from-literal=cert-manager="$(openssl rand -base64 32)" \
#     --from-file=cloudflare=./cloudflare-token
config:
  keys:
    - name: cert-manager.
      secretFile: /run/secrets/tsigoat/cert-manager
  backends:
    - name: cloudflare
      type: cloudflare
      cloudflare:
        apiTokenFile: /run/secrets/tsigoat/cloudflare
  zones:
    - name: example.com.
      policy:
        - key: cert-manager.
          acme: ["example.com.", "**.example.com."]

secret:
  existingSecret: tsigoat-secrets
