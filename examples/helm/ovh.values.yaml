# tsigoat in front of OVHcloud, for cert-manager: cert-manager signs its
# updates with a TSIG key restricted to the ACME challenges, and never sees
# the credentials of the API. docs/ovh.md tells how to create them, restricted
# to the zone.
#
# The Secret holds the TSIG secret of the cert-manager. key, the application
# secret and the consumer key; create it before installing the chart:
#
#   kubectl -n tsigoat create secret generic tsigoat-secrets \
#     --from-literal=cert-manager="$(openssl rand -base64 32)" \
#     --from-file=ovh-application-secret=./application-secret \
#     --from-file=ovh-consumer-key=./consumer-key
config:
  keys:
    - name: cert-manager.
      secretFile: /run/secrets/tsigoat/cert-manager
  backends:
    - name: ovh
      type: ovh
      ovh:
        endpoint: ovh-eu
        applicationKey: 7kbG7Bk7S9Nt7ZSV
        applicationSecretFile: /run/secrets/tsigoat/ovh-application-secret
        consumerKeyFile: /run/secrets/tsigoat/ovh-consumer-key
  zones:
    - name: example.com.
      policy:
        - key: cert-manager.
          acme: ["example.com.", "**.example.com."]

secret:
  existingSecret: tsigoat-secrets
