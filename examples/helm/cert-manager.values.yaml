# tsigoat in front of PowerDNS, for the cert-manager of the same cluster.
#
# The Secret holds the TSIG secret of the cert-manager. key and the key of the
# PowerDNS API; create it before installing the chart:
#
#   kubectl create namespace tsigoat
#   kubectl -n tsigoat create secret generic tsigoat-secrets \
#     --from-literal=cert-manager="$(openssl rand -base64 32)" \
#     --from-literal=powerdns-api-key=...
#
# Then install the chart, and point cert-manager to
# tsigoat.tsigoat.svc.cluster.local:53, see cert-manager-issuer.yaml:
#
#   helm -n tsigoat install tsigoat oci://quay.io/enix/charts/tsigoat \
#     --values cert-manager.values.yaml
config:
  keys:
    - name: cert-manager.
      algorithm: hmac-sha256
      secretFile: /run/secrets/tsigoat/cert-manager
  backends:
    - name: pdns
      type: powerdns
      powerdns:
        url: http://pdns-api.powerdns.svc.cluster.local:8081
        apiKeyFile: /run/secrets/tsigoat/powerdns-api-key
  zones:
    - name: example.com.
      policy:
        - key: cert-manager.
          acme: ["example.com.", "**.example.com."]

secret:
  existingSecret: tsigoat-secrets
