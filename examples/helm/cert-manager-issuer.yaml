# A cert-manager ClusterIssuer that solves the ACME DNS-01 challenges through
# tsigoat, installed with cert-manager.values.yaml. Its Secret, in the
# namespace of cert-manager, holds the TSIG secret of the cert-manager. key:
#
#   kubectl -n cert-manager create secret generic tsigoat-tsig-key \
#     --from-literal=secret="$(kubectl -n tsigoat get secret tsigoat-secrets \
#       -o jsonpath='{.data.cert-manager}' | base64 -d)"
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hostmaster@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - selector:
          dnsZones: [example.com]
        dns01:
          rfc2136:
            nameserver: tsigoat.tsigoat.svc.cluster.local:53
            tsigKeyName: cert-manager.
            # cert-manager defaults to HMACMD5, which the key does not allow.
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: tsigoat-tsig-key
              key: secret
