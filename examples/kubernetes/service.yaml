apiVersion: v1
kind: Service
metadata:
  name: tsigoat
  labels:
    app.kubernetes.io/name: tsigoat
spec:
  selector:
    app.kubernetes.io/name: tsigoat
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: admin
      port: 9153
      targetPort: admin
      protocol: TCP
