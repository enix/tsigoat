# Replace the values, or create the Secret out of band:
#
#   kubectl -n tsigoat create secret generic tsigoat \
#     --from-literal=cert-manager="$(openssl rand -base64 32)" \
#     --from-literal=powerdns-api-key=...
apiVersion: v1
kind: Secret
metadata:
  name: tsigoat
type: Opaque
stringData:
  # The TSIG secret of the cert-manager. key, base64-encoded.
  cert-manager: REPLACE-WITH-THE-BASE64-TSIG-SECRET
  # The key of the PowerDNS HTTP API.
  powerdns-api-key: REPLACE-WITH-THE-POWERDNS-API-KEY
