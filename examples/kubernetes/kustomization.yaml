# tsigoat in front of PowerDNS, for cert-manager: `kubectl apply -k .`, once
# secret.yaml holds the real secrets and config.yaml the real zones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tsigoat
resources:
  - namespace.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: tsigoat
    files:
      - config.yaml
