{{- $exposed := ne .Values.service.type "ClusterIP" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tsigoat.fullname" . }}
  namespace: {{ include "tsigoat.namespace" . }}
  labels:
    {{- include "tsigoat.labels" . | nindent 4 }}
    app.kubernetes.io/component: dns
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and $exposed .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "tsigoat.selectorLabels" . | nindent 4 }}
  ports:
    - name: dns-udp
      port: {{ .Values.service.port }}
      targetPort: dns-udp
      protocol: UDP
      {{- if and $exposed .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: dns-tcp
      port: {{ .Values.service.port }}
      targetPort: dns-tcp
      protocol: TCP
      {{- if and $exposed .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
