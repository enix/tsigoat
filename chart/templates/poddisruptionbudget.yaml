{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tsigoat.fullname" . }}
  namespace: {{ include "tsigoat.namespace" . }}
  labels:
    {{- include "tsigoat.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ toYaml .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "tsigoat.selectorLabels" . | nindent 6 }}
{{- end }}
