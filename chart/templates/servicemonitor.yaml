{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tsigoat.fullname" . }}
  namespace: {{ include "tsigoat.namespace" . }}
  labels:
    {{- include "tsigoat.objectLabels" (dict "root" . "extra" .Values.serviceMonitor.extraLabels) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tsigoat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  endpoints:
    - port: admin
      path: /metrics
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
