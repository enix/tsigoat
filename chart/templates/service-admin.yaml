# The administration server has no authentication: its Service stays inside
# the cluster, apart from the DNS one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tsigoat.fullname" . }}-admin
  namespace: {{ include "tsigoat.namespace" . }}
  labels:
    {{- include "tsigoat.objectLabels" (dict "root" . "component" "admin") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tsigoat.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
      protocol: TCP
