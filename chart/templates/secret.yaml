{{- if and .Values.secret.existingSecret .Values.secret.files }}
{{- fail "set secret.existingSecret or secret.files, not both" }}
{{- end }}
{{- if and .Values.secret.files (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tsigoat.fullname" . }}
  namespace: {{ include "tsigoat.namespace" . }}
  labels:
    {{- include "tsigoat.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $content := .Values.secret.files }}
  {{ $name | quote }}: {{ $content | toString | b64enc | quote }}
  {{- end }}
{{- end }}
