# -- Partially override the name of the resources, which the release name prefixes
nameOverride: ""
# -- Fully override the name of the resources
fullnameOverride: ""
# -- Override the namespace of the resources
namespaceOverride: ""
# -- Read by a parent chart that installs this one under a `condition`, such
# as `tsigoat.enabled`; the chart itself ignores it
enabled: true
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Labels added to every object of the chart; `podLabels` labels the pod.
# The labels of the chart win over them, and so do those of each object
extraLabels: {}

image:
  # -- Image registry; an empty string lets the container runtime choose
  registry: ghcr.io
  # @schema
  # type: string
  # minLength: 1
  # @schema
  # -- Image repository
  repository: enix/tsigoat
  # -- Image tag; the appVersion of the chart by default
  tag: ""
  # -- Appended to the tag: `-busybox` selects the image with a shell
  tagSuffix: ""
  # -- Image digest, which takes precedence over the tag
  digest: ""
  # -- Pull the tags of the release by the digests of `image.digests`; false
  # pulls by tag, for a registry that holds other digests, such as a mirror
  # that copied one platform
  pinDigest: true
  # @schema
  # type: object
  # properties: {}
  # additionalProperties:
  #   type: string
  # @schema
  # -- Digests of the images of the release, by tag, which the release writes:
  # the digest of each multi-platform image, the same on every registry
  # @default -- the digests of the release; empty in the repository
  digests: {}
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy
  pullPolicy: IfNotPresent
# @schema
# type: array
# items:
#   type: string
# @schema
# -- Names of the Secrets to pull the image with
imagePullSecrets: []

# @schema
# type: integer
# minimum: 1
# @schema
# -- Number of pods. Several pods keep the records of each other's updates,
# on PowerDNS since 4.9.12 and 5.0.2, but not every guarantee of RFC 2136
# across pods. 1, with the `Recreate` strategy, keeps them all, but while a
# pod deleted or evicted outside a rollout finishes its updates beside its
# replacement: see [Replicas](#replicas)
replicaCount: 2

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Update strategy of the Deployment. Helm merges the fields given here
# with these defaults: with `maxSurge: 0`, set `maxUnavailable` above 0 too
# @default -- a rolling update that starts a new pod before stopping an old one
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  # -- Create a PodDisruptionBudget, with more than one replica
  enabled: true
  # @schema
  # type: [integer, string]
  # minimum: 0
  # pattern: ^[0-9]+%$
  # @schema
  # -- Pods that a voluntary disruption, such as the drain of a node, may stop
  # at once: a number, or a percentage such as `50%`
  maxUnavailable: 1

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Configuration of tsigoat: `keys`, `backends` and `zones`, as
# [docs/configuration.md](https://github.com/enix/tsigoat/blob/main/docs/configuration.md)
# describes them. The chart sets the listen addresses itself. Secret files
# are read from `/run/secrets/tsigoat`, see `secret`.
# @default -- none: the chart refuses to install without zones and backends
config: {}

secret:
  # -- Name of an existing Secret, mounted in `/run/secrets/tsigoat`, whose
  # keys the configuration reads with `secretFile` and `apiKeyFile`
  existingSecret: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Files of a Secret that the chart creates and mounts in
  # `/run/secrets/tsigoat`, by file name; prefer `existingSecret`, which keeps
  # the secrets out of the release
  files: {}

log:
  # @schema
  # type: string
  # enum: [text, json]
  # @schema
  # -- Log format
  format: json
  # @schema
  # type: string
  # enum: [debug, info, warn, error]
  # @schema
  # -- Log level
  level: info

# @schema
# type: string
# minLength: 1
# @schema
# -- Host part of the listen addresses in the pod: `[::]` serves IPv4 and
# IPv6, `0.0.0.0` serves IPv4 on nodes without IPv6; the chart puts an IPv6
# address in brackets
listenHost: "[::]"

service:
  # @schema
  # type: string
  # enum: [ClusterIP, NodePort, LoadBalancer]
  # @schema
  # -- Type of the DNS Service: `LoadBalancer` or `NodePort` exposes tsigoat
  # out of the cluster
  type: ClusterIP
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- DNS port of the Service, for both UDP and TCP
  port: 53
  # @schema
  # type: integer
  # minimum: 0
  # maximum: 65535
  # @schema
  # -- Node port for both UDP and TCP, with `NodePort` and `LoadBalancer`; 0
  # lets Kubernetes choose
  nodePort: 0
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Annotations of the DNS Service, such as those of a cloud load balancer
  annotations: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Labels of the DNS Service, such as those that a BGP advertisement or a
  # load balancer selects; they win over `extraLabels`, and the labels of the
  # chart over both
  extraLabels: {}
  # -- Cluster IP of the DNS Service, in the service range of the cluster;
  # Kubernetes assigns one when empty
  clusterIP: ""
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  # -- Addresses out of the cluster that reach the DNS Service, such as those
  # that the network announces through BGP; a `ClusterIP` Service serves them.
  # Kubernetes deprecates this field, which some clusters refuse: a
  # `LoadBalancer` Service serves such addresses where the cluster has a load
  # balancer
  externalIPs: []
  # @schema
  # type: string
  # enum: ["", SingleStack, PreferDualStack, RequireDualStack]
  # @schema
  # -- IP family policy of the DNS Service; `SingleStack` when empty
  ipFamilyPolicy: ""
  # @schema
  # type: array
  # uniqueItems: true
  # maxItems: 2
  # items:
  #   type: string
  #   enum: [IPv4, IPv6]
  # @schema
  # -- IP families of the DNS Service, the first one being that of its cluster
  # IP; the families of the cluster when empty
  ipFamilies: []
  # @schema
  # type: string
  # enum: ["", Cluster, Local]
  # @schema
  # -- internalTrafficPolicy of the DNS Service: `Local` sends the requests of
  # the pods of a node to the tsigoat pods of that node alone
  internalTrafficPolicy: ""
  # -- trafficDistribution of the DNS Service, such as `PreferSameZone`, which
  # prefers the pods of the zone of the client
  trafficDistribution: ""
  # @schema
  # type: string
  # enum: ["", Cluster, Local]
  # @schema
  # -- externalTrafficPolicy of a `NodePort` or `LoadBalancer` Service, or of
  # one with `externalIPs`: `Local` keeps the addresses of the clients in the
  # logs
  externalTrafficPolicy: ""
  # @schema
  # type: integer
  # minimum: 0
  # maximum: 65535
  # @schema
  # -- Node port of the health check of a `LoadBalancer` Service whose
  # `externalTrafficPolicy` is `Local`; 0 lets Kubernetes choose
  healthCheckNodePort: 0
  # @schema
  # type: array
  # items:
  #   type: string
  # @schema
  # -- Sources allowed to reach a `LoadBalancer` Service, as CIDR blocks
  loadBalancerSourceRanges: []
  # -- Class of a `LoadBalancer` Service
  loadBalancerClass: ""
  # -- Address of a `LoadBalancer` Service, for the load balancers that read
  # this field, which Kubernetes deprecates for their own annotations
  loadBalancerIP: ""
  # @schema
  # type: boolean
  # @schema
  # -- Allocate node ports to a `LoadBalancer` Service; false for a load
  # balancer that reaches the pods directly
  allocateLoadBalancerNodePorts: true
  # @schema
  # type: string
  # enum: [None, ClientIP]
  # @schema
  # -- Session affinity of the DNS Service: `ClientIP` sends the requests of a
  # client to one pod, which serializes the updates of that client, not those
  # of other clients
  sessionAffinity: None
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 86400
  # @schema
  # -- How long a client stays with its pod after its last request, in
  # seconds, with `ClientIP`
  sessionAffinityTimeoutSeconds: 10800

admin:
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- Port of the administration server, which serves `/healthz`, `/readyz`
  # and `/metrics` to the probes and Prometheus, through its own `ClusterIP`
  # Service; any port but 5353, the DNS port of the container
  port: 9153

serviceMonitor:
  # -- Create a ServiceMonitor for the Prometheus operator
  enabled: false
  # -- Scrape interval; the default of Prometheus when empty
  interval: ""
  # -- Scrape timeout; the default of Prometheus when empty
  scrapeTimeout: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Labels of the ServiceMonitor, such as those that Prometheus selects;
  # they win over `extraLabels`, and the labels of the chart over both
  extraLabels: {}
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Relabelings of the targets
  relabelings: []
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Relabelings of the metrics
  metricRelabelings: []

prometheusRules:
  # -- Create a PrometheusRule with the alerts of tsigoat
  enabled: false
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Labels of the PrometheusRule, such as those that Prometheus selects;
  # they win over `extraLabels`, and the labels of the chart over both
  extraLabels: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Labels added to every alert, which override the severity of the
  # alerts too
  alertLabels: {}
  # -- PromQL label matchers that select the metrics of the release, such as
  # `job="tsigoat"`; the namespace of the release and the job of the
  # ServiceMonitor by default
  selector: ""
  # @schema
  # type: array
  # uniqueItems: true
  # items:
  #   type: string
  #   enum: [TsigoatBackendErrors, TsigoatUncertainUpdates, TsigoatUpdatesFailing, TsigoatSignatureFailures, TsigoatLegacyAlgorithm]
  # @schema
  # -- Alerts to leave out, by name: `TsigoatBackendErrors`,
  # `TsigoatUncertainUpdates`, `TsigoatUpdatesFailing`,
  # `TsigoatSignatureFailures`, `TsigoatLegacyAlgorithm`
  disabledAlerts: []

serviceAccount:
  # -- Create a ServiceAccount; tsigoat makes no call to the Kubernetes API
  create: true
  # -- Name of the ServiceAccount; the name of the release by default
  name: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Annotations of the ServiceAccount
  annotations: {}

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Annotations of the pod
podAnnotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Labels of the pod; its selector labels win over them
podLabels: {}

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Security context of the pod
# @default -- non-root, with the runtime default seccomp profile
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Security context of the container
# @default -- no privilege escalation, read-only root, no capability
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Resources of the container
# @default -- requests of 10m CPU and 32Mi, limit of 128Mi
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Liveness probe of the container. Helm merges the fields given here with
# the default: set `httpGet: null` for another kind of probe
# @default -- `/healthz` on the administration port
livenessProbe:
  httpGet:
    path: /healthz
    port: admin
  periodSeconds: 10
# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Readiness probe of the container. Helm merges the fields given here with
# the default: set `httpGet: null` for another kind of probe
# @default -- `/readyz` on the administration port
readinessProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 5

# @schema
# type: array
# items:
#   type: object
# @schema
# -- Environment variables of the container, for the `secretEnv` and
# `apiKeyEnv` settings of the configuration
extraEnv: []
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Volumes added to the pod, such as a CA bundle for the PowerDNS API
extraVolumes: []
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Volume mounts added to the container
extraVolumeMounts: []

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Node selector of the pod
nodeSelector: {}
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Tolerations of the pod
tolerations: []
# @schema
# type: object
# additionalProperties: true
# properties: {}
# @schema
# -- Affinity of the pod
affinity: {}
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Topology spread constraints of the pods, such as one per node; their
# `labelSelector` defaults to the labels of the pods
topologySpreadConstraints: []
# -- Priority class of the pod
priorityClassName: ""
# @schema
# type: integer
# minimum: 0
# @schema
# -- Time that a stopping pod goes on serving, while its readiness probe
# fails, so that the Services stop sending it requests first
shutdownDelaySeconds: 5
# @schema
# type: integer
# minimum: 0
# @schema
# -- Time given to a stopping pod: the shutdown delay, then the updates in
# progress, which take 26 seconds at most
terminationGracePeriodSeconds: 40

# -- Additional objects to deploy with the release, as YAML objects or
# strings, both rendered as templates
extraDeploy: []

# @schema
# type: object
# additionalProperties: true
# @schema
global:
  # -- Registry of every image, which overrides `image.registry`
  imageRegistry: ""
